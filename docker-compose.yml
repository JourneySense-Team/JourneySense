version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: journeysense-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=journeysensedb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: